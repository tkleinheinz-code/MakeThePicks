<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile | Make The Picks</title>
<link rel="stylesheet" href="styles.css">

<style>

/* Layout */
.profile-container {
  max-width: 1000px;
  margin: 40px auto;
}

/* Top Section */
.profile-top {
  display: flex;
  gap: 24px;
}

/* Photo box */
.profile-photo {
  width: 150px;
}

.profile-photo img {
  width: 100%;
  border: 2px solid #333;
  border-radius: 8px;
}

.profile-photo input {
  margin-top: 10px;
}

/* Right side info */
.profile-info {
  flex: 1;
}

/* Name */
.profile-name {
  font-size: 28px;
  margin-bottom: 12px;
  background: transparent;
  border: none;
  color: #fff;
  font-weight: bold;
  width: 100%;
}

/* Subtle underline on focus */
.profile-name:focus {
  outline: none;
  border-bottom: 2px solid #ffd77a;
}

/* Bio */
.profile-bio {
  width: 100%;
  height: 100px;
  padding: 10px;
  background: #000;
  border: 1px solid #333;
  color: #fff;
  margin-bottom: 20px;
}

/* Buttons */
.profile-actions {
  display: flex;
  gap: 32px;
  align-items: flex-start;
  margin-top: 16px;
}

/* Left column buttons */
.primary-actions {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 220px;
}

/* Right row of buttons */
.secondary-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;   /* wraps nicely on smaller screens */
}
``

/* Bottom section */
.past-drafts {
  margin-top: 48px;
}

.past-drafts h2 {
  margin-bottom: 16px;
  color: #ffd77a;
}

/* Placeholder list */
.past-drafts ul {
  list-style: none;
  padding: 0;
}

.past-drafts li {
  padding: 10px;
  border-bottom: 1px solid #333;
}
  
.draft-cards {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;   /* keeps responsive */
}

.draft-card {
  background: #111;
  border: 1px solid #333;
  padding: 14px;
  border-radius: 6px;
  min-width: 220px;
  flex: 1;
}

  .draft-card:hover {
  border-color: #ffd77a;
}

  .profile-info {
  flex: 1;
  padding-left: 40px;  /* ⬅ pushes everything right */
}

</style>
</head>

<body>

<header class="header">
  <div class="logo">
    <a href="index.html">MAKE THE PICKS</a>
  </div>
</header>

<main class="content profile-container">

  <!-- TOP SECTION -->
  <div class="profile-top">

    <!-- Photo -->
    <div class="profile-photo">
      <img id="profilePreview" src="images/photo-placeholder.jpg" alt="Profile Photo">
      <input type="file" id="photoUpload" accept="image/*">
    </div>

    <!-- Info -->
    <div class="profile-info">

    <input
  type="text" 
  class="profile-name" 
  id="profileName" 
  value="<<Your Name>>"
/>

      <textarea class="profile-bio" placeholder="Add a short bio..."></textarea>

<div class="profile-actions">

  <!-- Left column buttons -->
  <div class="primary-actions">
    <button class="cta-button" onclick="location.href='drag-draft.htmlss="cta-button" onclick="location.href='mock-draft.htmlght row of buttons -->
  <div class="secondary-actions">
    <button class="cta-button">DRAFT NEW TEAM</button>
    <button class="cta-button">SUBMIT MOCK DRAFT</button>
    <button class="cta-button">VIEW MY TEAM</button>
    <button class="cta-button">DRAFT MY NFL TEAM</button>
  </div>

</div>

  </div>

  <!-- BOTTOM SECTION -->
  <div class="past-drafts">
    <h2>Past Draft Picks</h2>

<div class="draft-cards">
  <div class="draft-card">2026 Mock Draft – 87 Points</div>
  <div class="draft-card">2025 Mock Draft – 102 Points</div>
  <div class="draft-card">49ers Roster Build – Completed</div>
</div>

  </div>

</main>

<script>

/* ✅ Photo upload preview */
const photoUpload = document.getElementById('photoUpload');
const profilePreview = document.getElementById('profilePreview');

photoUpload.addEventListener('change', () => {
  const file = photoUpload.files[0];

  if (file) {
    profilePreview.src = URL.createObjectURL(file);
  }
});

</script>

</body>
</html>
