<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mock Schedule</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .home { background:#d1fae5; }
    .away { background:#fee2e2; }
    .bye  { background:#e5e7eb; }

    .sticky-col {
      position: sticky;
      left: 0;
      background: #f3f4f6;
      z-index: 5;
    }
  </style>
</head>

<body class="p-6">

<h1 class="text-xl font-bold mb-4">2026 Mock Schedule Grid</h1>

<div class="overflow-auto">
<table id="grid" class="border">
<thead>
<tr>
<th class="sticky-col border p-1">Team</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<script>

// TEAMS
const teams = Object.keys(rawScheduleData);

// LOGOS
const logos = {};
teams.forEach(t=>{
  logos[t] = "https://a.espncdn.com/i/teamlogos/nfl/500/" +
    (t === "WAS" ? "wsh" : t.toLowerCase()) + ".png";
});

// WEEKS
const weeks = Array.from({length:18}, (_,i)=>"W"+(i+1));

// HEADER
const headerRow = document.querySelector("#grid thead tr");
weeks.forEach(w=>{
  const th=document.createElement("th");
  th.textContent=w;
  th.className="border p-1";
  headerRow.appendChild(th);
});

// STORE
let schedule = {};
teams.forEach(t=>{
  schedule[t]={};
  weeks.forEach(w=>schedule[t][w]="");
});

const tbody = document.querySelector("#grid tbody");

// CREATE CELL
function createCell(team,week){

  const td=document.createElement("td");
  td.className="border p-1 relative";

  const val=schedule[team][week];

  // ✅ DISPLAY MODE
  if(val){
    const box=document.createElement("div");

    if(val==="BYE"){
      box.textContent="BYE";
      box.className="bye cursor-pointer";
    } else {

      const opp=val.substring(1);
      const isHome=val.startsWith("v");

      const img=document.createElement("img");
      img.src=logos[opp];
      img.style.width="18px";

      box.appendChild(img);
      box.appendChild(document.createTextNode(
        " " + (isHome?"vs ":"@ ") + opp
      ));

      box.className=(isHome?"home ":"away ")+"cursor-pointer";
    }

    box.onclick=()=>{
      schedule[team][week]="";
      render();
    };

    td.appendChild(box);
    return td;
  }

  // ✅ EDIT MODE
  const btn=document.createElement("button");
  btn.textContent="Pick";
  btn.className="text-xs border px-1";

  const menu=document.createElement("div");
  menu.style.display="none";
  menu.style.position="absolute";
  menu.style.background="white";
  menu.style.border="1px solid black";
  menu.style.maxHeight="150px";
  menu.style.overflowY="auto";
  menu.style.zIndex="1000";
  menu.style.width="120px";

  rawScheduleData[team].forEach(opt=>{

    const item=document.createElement("div");
    item.style.padding="4px";
    item.style.cursor="pointer";

    if(opt==="Bye"){
      item.textContent="BYE";
    } else {

      const opp=opt.substring(1);

      const img=document.createElement("img");
      img.src=logos[opp];
      img.style.width="14px";
      img.style.marginRight="5px";

      item.appendChild(img);
      item.appendChild(document.createTextNode(opt));
    }

    item.onmouseover=()=>item.style.background="#eee";
    item.onmouseout=()=>item.style.background="white";

    item.onclick=()=>{

      if(opt==="Bye"){
        schedule[team][week]="BYE";
      } else {
        const opp=opt.substring(1);
        const isHome=opt.startsWith("v");

        schedule[team][week]=opt;
        schedule[opp][week]=(isHome?"a":"v")+team;
      }

      render();
    };

    menu.appendChild(item);
  });

  btn.onclick=()=>{
    menu.style.display = (menu.style.display==="none")?"block":"none";
  };

  td.appendChild(btn);
  td.appendChild(menu);

  return td;
}

// ✅ RENDER
function render(){
  tbody.innerHTML="";

  teams.forEach(team=>{
    const tr=document.createElement("tr");

    const td=document.createElement("td");
    td.className="sticky-col border";

    const img=document.createElement("img");
    img.src=logos[team];
    img.style.width="20px";

    td.appendChild(img);
    td.appendChild(document.createTextNode(" "+team));
    tr.appendChild(td);

    weeks.forEach(w=>{
      tr.appendChild(createCell(team,w));
    });

    tbody.appendChild(tr);
  });
}

// START
render();

</script>
</body>
</html>
