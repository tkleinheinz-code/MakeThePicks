<!DOCTYPE html>
<html>
<body>

<h2>2026 Mock Schedule</h2>

<table border="1" id="grid">
  <thead>
    <tr>
      <th>Team</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>

// ✅ FULL 32 TEAMS
const teams = [
  "BUF","MIA","NE","NYJ","BAL","CIN","CLE","PIT",
  "HOU","IND","JAX","TEN","DEN","KC","LV","LAC",
  "DAL","NYG","PHI","WAS","CHI","DET","GB","MIN",
  "ATL","CAR","NO","TB","ARI","LAR","SF","SEA"
];

// ✅ SIMPLE OPPONENT RULE (no self)
const validOpponents = {};
teams.forEach(team=>{
  validOpponents[team] = teams.filter(t => t !== team);
});

// ✅ LOGOS
const logos = {};
teams.forEach(t=>{
  logos[t] =
    "https://a.espncdn.com/i/teamlogos/nfl/500/" +
    (t === "WAS" ? "wsh" : t.toLowerCase()) + ".png";
});

// ✅ WEEKS
const weeks = ["W1","W2","W3","W4","W5"];

// ✅ ADD HEADERS
const headerRow = document.querySelector("#grid thead tr");
weeks.forEach(w=>{
  const th = document.createElement("th");
  th.textContent = w;
  headerRow.appendChild(th);
});

// ✅ DATA STORE
let schedule = {};
teams.forEach(t=>{
  schedule[t] = {};
  weeks.forEach(w=>schedule[t][w] = "");
});

const tbody = document.querySelector("#grid tbody");

// ✅ CREATE CELL
function createCell(team, week){

  const td = document.createElement("td");
  const val = schedule[team][week];

  // ✅ DISPLAY MODE
  if(val){
    const d = document.createElement("div");

    const opp = val.substring(2);   // remove "v " or "@ "
    const isHome = val.startsWith("v");

    // ✅ LOGO + TEXT (safe, no template issues)
    const img = document.createElement("img");
    img.src = logos[opp];
    img.width = 18;

    d.appendChild(img);

    const label = document.createTextNode(
      " " + (isHome ? "vs " : "@ ") + opp
    );
    d.appendChild(label);

    d.onclick = ()=>{
      schedule[team][week] = "";
      render();
    };

    td.appendChild(d);
    return td;
  }

  // ✅ EDIT MODE
  const btn = document.createElement("button");
  btn.textContent = "Pick";

  const menu = document.createElement("div");
  menu.style.display = "none";
  menu.style.border = "1px solid #ccc";
  menu.style.background = "white";
  menu.style.position = "absolute";

  validOpponents[team].forEach(t=>{

    const item = document.createElement("div");
    item.style.cursor = "pointer";

    const img = document.createElement("img");
    img.src = logos[t];
    img.width = 14;

    item.appendChild(img);
    item.appendChild(document.createTextNode(" " + t));

    item.onclick = ()=>{
      schedule[team][week] = "v " + t;
      schedule[t][week] = "@ " + team;
      render();
    };

    menu.appendChild(item);
  });

  btn.onclick = ()=>{
    menu.style.display = menu.style.display === "none" ? "block" : "none";
  };

  td.appendChild(btn);
  td.appendChild(menu);

  return td;
}

// ✅ RENDER
function render(){
  tbody.innerHTML = "";

  teams.forEach(team=>{
    const tr = document.createElement("tr");

    // TEAM CELL
    const td = document.createElement("td");

    const img = document.createElement("img");
    img.src = logos[team];
    img.width = 18;

    td.appendChild(img);
    td.appendChild(document.createTextNode(" " + team));

    tr.appendChild(td);

    // WEEK CELLS
    weeks.forEach(w=>{
      tr.appendChild(createCell(team,w));
    });

    tbody.appendChild(tr);
  });
}

// ✅ START
render();

</script>

</body>
</html>
