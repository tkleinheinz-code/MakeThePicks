<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NFL Schedule Grid</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="p-6">

<h1 class="text-3xl font-bold mb-4">NFL Schedule Grid</h1>

<input id="search" placeholder="Search team..."
  class="mb-4 p-2 border rounded w-64" />

<div class="overflow-auto border">
  <table class="min-w-full text-sm text-center" id="grid">
    <thead class="bg-gray-200">
      <tr>
        <th class="p-2 border">Team</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
const teams = [
  "ARI","ATL","BAL","BUF","CAR","CHI","CIN","CLE","DAL","DEN",
  "DET","GB","HOU","IND","JAX","KC","LV","LAC","LAR","MIA",
  "MIN","NE","NO","NYG","NYJ","PHI","PIT","SEA","SF","TB","TEN","WAS"
];

const weeks = Array.from({ length: 18 }, (_, i) => "W" + (i+1));

const table = document.getElementById("grid");
const headerRow = table.querySelector("thead tr");

// Add week headers
weeks.forEach(w => {
  const th = document.createElement("th");
  th.textContent = w;
  th.className = "p-2 border";
  headerRow.appendChild(th);
});

const tbody = table.querySelector("tbody");

// Build rows
function renderRows(filter="") {
  tbody.innerHTML = "";

  teams
    .filter(t => t.toLowerCase().includes(filter.toLowerCase()))
    .forEach(team => {
      const tr = document.createElement("tr");

      const tdTeam = document.createElement("td");
      tdTeam.textContent = team;
      tdTeam.className = "p-2 border font-bold bg-gray-100";
      tr.appendChild(tdTeam);

      weeks.forEach(() => {
        const td = document.createElement("td");
        td.className = "p-1 border";

        const input = document.createElement("input");
        input.className = "w-20 p-1 text-xs border rounded";
        input.placeholder = "@DAL";

        td.appendChild(input);
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });
}

renderRows();

// Search
document.getElementById("search").addEventListener("input", e => {
  renderRows(e.target.value);
});
</script>

</body>
</html>
