<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | Make The Picks</title>
<link rel="stylesheet" href="styles.css">

<style>
/* Center the form */
.signin-container {
  max-width: 400px;
  margin: 80px auto;
  padding: 24px;
  background: #111;
  border: 1px solid #333;
}

/* Title */
.signin-container h1 {
  text-align: center;
  margin-bottom: 24px;
}

/* Inputs */
.signin-container input {
  width: 100%;
  padding: 12px;
  margin-bottom: 16px;
  background: #000;
  border: 1px solid #333;
  color: #fff;
}

/* Links under password */
.signin-links {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 20px;
}

.signin-links a {
  color: #caa343;
  text-decoration: none;
}

.signin-links a:hover {
  text-decoration: underline;
}

/* Button spacing */
.signin-container button {
  width: 100%;
}
  
  <p style="text-align:center; color:#ccc; margin-bottom:20px;">
  Access your drafts and roster builds
</p>

</style>
</head>

<body>

<header class="header">
  <div class="logo">
    <a href="index.html">MAKE THE PICKS</a>
  </div>
</header>

<main class="content">

  <div class="signin-container">

    <h1>SIGN IN</h1>

    <form>

      <!-- Email -->
      <input type="email" placeholder="Email Address" required>

      <!-- Password -->
      <input type="password" placeholder="Password" required>

      <!-- Links -->
      <div class="signin-links">
        <a href="create-account.html">Create New Account</a>
        <a href="#" onclick="forgotPassword()">Forgot Password</a>
      </div>

      <!-- Button -->
      <button class="cta-button">SIGN IN</button>

    </form>

  </div>

</main>
  
  <script>

function forgotPassword() {
  const email = prompt("Enter your email address:");

  if (!email) return;

  // Simulate checking stored account
  const savedEmail = localStorage.getItem("userEmail");

  if (email === savedEmail) {
    alert("Password reset link sent to " + email);
  } else {
    alert("Email not found");
  }
}

</script>
  </body>
</html>
