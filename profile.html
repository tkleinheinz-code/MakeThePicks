<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile | Make The Picks</title>
<link rel="stylesheet" href="styles.css">

<style>

/* Layout */
.profile-container {
  max-width: 1000px;
  margin: 40px auto;
}

/* Top Section */
.profile-top {
  display: flex;
  gap: 24px;
}

/* Photo */
.profile-photo {
  width: 150px;
}

.profile-photo img {
  width: 100%;
  border: 2px solid #333;
  border-radius: 8px;
}

.profile-photo input {
  margin-top: 10px;
}

/* Right side */
.profile-info {
  flex: 1;
  padding-left: 40px; /* space from file input */
}

/* Name */
.profile-name {
  font-size: 28px;
  margin-bottom: 12px;
  background: transparent;
  border: none;
  color: #fff;
  font-weight: bold;
  width: 100%;
}

.profile-name:focus {
  outline: none;
  border-bottom: 2px solid #ffd77a;
}

/* Bio */
.profile-bio {
  width: 100%;
  height: 100px;
  padding: 10px;
  background: #000;
  border: 1px solid #333;
  color: #fff;
  margin-bottom: 20px;
}

/* Buttons (3 only) */
.profile-actions {
  display: flex;
  gap: 12px;
}

.profile-actions .cta-button {
  flex: 1;   /* ✅ equal width buttons */
}

/* Bottom section */
.past-drafts {
  margin-top: 80px;   /* ✅ pushes to bottom half */
}

.past-drafts h2 {
  margin-bottom: 16px;
  color: #ffd77a;
}

  .draft-list {
  list-style: none;
  padding: 0;
  display: flex;        /* ✅ makes items horizontal */
  gap: 16px;            /* space between items */
  flex-wrap: wrap;      /* wraps on smaller screens */
}

.draft-list li {
  padding: 12px;
  border: 1px solid #333;
  border-radius: 6px;
  background: #111;
  min-width: 220px;
}

</style>
</head>

<body>

<header class="header">
  <div class="logo">
    <a href="index.html">MAKE THE PICKS</a>
  </div>
</header>

<main class="content profile-container">

  <!-- TOP SECTION -->
  <div class="profile-top">

    <!-- Photo -->
    <div class="profile-photo">
      <img id="profilePreview" src="images/photo-placeholder.jpg" alt="Profile Photo">
      <input type="file" id="photoUpload" accept="image/*">
    </div>

    <!-- Info -->
    <div class="profile-info">

      <input 
        type="text" 
        class="profile-name" 
        id="profileName" 
        value="<<Your Name>>"
      >

      <textarea class="profile-bio" placeholder="Add a short bio..."></textarea>

      <!-- ✅ 3 CLEAN BUTTONS -->
<div class="profile-actions">
  <button class="cta-button">Submit Mock Draft</button>
  <button class="cta-button">View My NFL Team</button>
  <button class="cta-button">View My Team</button>
</div>

    </div>
  </div>

  <!-- ✅ BOTTOM HALF -->
  <div class="past-drafts">
    <h2>Past Draft Picks</h2>

    <ul class="draft-list">
  <li>2026 Draft Picks</li>
  <li>2025 Draft Picks</li>
  <li>Current Roster</li>
</ul>
  </div>

</main>

<script>

/* ✅ Photo preview */
const photoUpload = document.getElementById('photoUpload');
const profilePreview = document.getElementById('profilePreview');

photoUpload.addEventListener('change', () => {
  const file = photoUpload.files[0];

  if (file) {
    profilePreview.src = URL.createObjectURL(file);
  }
});

</script>

</body>
</html>
