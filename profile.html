<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Make The Picks</title>
<link rel="stylesheet" href="styles.css">

<style>

/* Layout */
.profile-container {
  max-width: 1000px;
  margin: 40px auto;
}

/* Top row */
.profile-top {
  display: flex;
  gap: 24px;
}

/* Photo */
.profile-photo {
  width: 150px;
}

.profile-photo img {
  width: 100%;
  border: 2px solid #333;
  border-radius: 8px;
}

/* Info area */
.profile-info {
  flex: 1;
  padding-left: 40px;
}

/* Name */
.profile-name {
  font-size: 28px;
  margin-bottom: 4px;
  background: transparent;
  border: none;
  color: #fff;
  font-weight: bold;
  width: 100%;
}

/* GM since */
.gm-since {
  color: #caa343;
  font-size: 14px;
  margin-bottom: 16px;
}

/* Team dropdown */
.team-label {
  display: block;
  margin-bottom: 6px;
  color: #ccc;
}

.team-select {
  width: 100%;
  padding: 10px;
  margin-bottom: 20px;
  background: #000;
  border: 1px solid #333;
  color: #fff;
}

/* Buttons */
.profile-actions {
  display: flex;
  gap: 12px;
  margin-bottom: 30px;
}

.profile-actions .cta-button {
  flex: 1;
}

/* Stats section */
.stats {
  display: flex;
  gap: 16px;
  margin-bottom: 40px;
}

.stat-box {
  flex: 1;
  background: #111;
  border: 1px solid #333;
  padding: 16px;
  text-align: center;
}

.stat-box h3 {
  color: #ffd77a;
  margin-bottom: 6px;
}

/* Bottom section */
.past-drafts {
  margin-top: 40px;
}

.past-drafts h2 {
  color: #ffd77a;
  margin-bottom: 16px;
}

/* Draft list */
.draft-list {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  list-style: none;
  padding: 0;
}

.draft-list li {
  background: #111;
  border: 1px solid #333;
  padding: 14px;
  min-width: 220px;
}

</style>
</head>

<body>

<header class="header">
  <div class="logo">
    <a href="index.html">MAKE THE PICKS</a>
  </div>
</header>

<main class="content profile-container">

<!-- TOP -->
<div class="profile-top">

  <div class="profile-photo">
    <img id="profilePreview" src="images/photo-placeholder.jpg">
  </div>

  <div class="profile-info">

    <input id="profileName" class="profile-name" value="Your Name">

    <p id="gmSince" class="gm-since"></p>

    <label class="team-label">What team would you like to GM?</label>

    <select class="team-select" id="teamSelect">
      <option value="">Select Team</option>
      <option>San Francisco 49ers</option>
      <option>Dallas Cowboys</option>
      <option>Philadelphia Eagles</option>
      <option>New York Giants</option>
      <option>Green Bay Packers</option>
      <option>Chicago Bears</option>
      <option>Detroit Lions</option>
      <option>Seattle Seahawks</option>
      <option>Los Angeles Rams</option>
      <option>Kansas City Chiefs</option>
      <option>Buffalo Bills</option>
      <option>Baltimore Ravens</option>
      <option>Miami Dolphins</option>
      <option>Cincinnati Bengals</option>
      <option>New York Jets</option>
      <option>Denver Broncos</option>
      <option>Las Vegas Raiders</option>
      <option>Los Angeles Chargers</option>
      <option>Arizona Cardinals</option>
      <option>Atlanta Falcons</option>
      <option>Carolina Panthers</option>
      <option>New Orleans Saints</option>
      <option>Tampa Bay Buccaneers</option>
      <option>Houston Texans</option>
      <option>Indianapolis Colts</option>
      <option>Jacksonville Jaguars</option>
      <option>Pittsburgh Steelers</option>
      <option>Cleveland Browns</option>
      <option>Minnesota Vikings</option>
      <option>Tennessee Titans</option>
      <option>Washington Commanders</option>
      <option>New England Patriots</option>
    </select>

  </div>
</div>

<!-- ACTIONS -->
<div class="profile-actions">

  <a href="mock-draft-submission.html">
    <button class="cta-button">Submit Mock Draft</button>
  </a>

  <button class="cta-button">View My NFL Team</button>
  <button class="cta-button">View My Team</button>

</div>

<!-- STATS -->
<div class="stats">

  <div class="stat-box">
    <h3>Drafts</h3>
    <p id="draftCount">0</p>
  </div>

  <div class="stat-box">
    <h3>Best Score</h3>
    <p id="bestScore">--</p>
  </div>

  <div class="stat-box">
    <h3>Teams</h3>
    <p id="teamsManaged">1</p>
  </div>

</div>

<!-- PAST DRAFTS -->
<div class="past-drafts">

  <h2>Past Draft Picks</h2>

  <ul class="draft-list">
    <li>2026 Draft Picks</li>
    <li>2025 Draft Picks</li>
    <li>Current Roster</li>
  </ul>

</div>

</main>

<script>

// Load Name
const name = localStorage.getItem('userName');
if (name) document.getElementById('profileName').value = name;

// GM Since
const gmSince = localStorage.getItem('gmSince');
if (gmSince) {
  document.getElementById('gmSince').textContent = "GM since " + gmSince;
}

</script>

</body>
</html>
