<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>2026 Mock Schedule Grid</title>
  https://cdn.tailwindcss.com

  <style>
    .home { background: #d1fae5; }   /* green */
    .away { background: #fee2e2; }   /* red */
    .bye  { background: #e5e7eb; }   /* gray */
  </style>
</head>

<body class="p-6 bg-gray-100">

<h1 class="text-3xl font-bold mb-4">2026 Mock Schedule Grid</h1>

<input id="search" class="mb-4 p-2 border rounded w-64"
  placeholder="Search team..." />

<div class="overflow-auto border bg-white">
  <table class="min-w-full text-sm text-center" id="grid">
    <thead class="bg-gray-300 sticky top-0">
      <tr>
        <th class="p-2 border">Team</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
// Teams (from your sheet)
const teams = [
  "BUF","MIA","NE","NYJ",
  "BAL","CIN","CLE","PIT",
  "HOU","IND","JAX","TEN",
  "DEN","KC","LV","LAC",
  "DAL","NYG","PHI","WAS",
  "CHI","DET","GB","MIN",
  "ATL","CAR","NO","TB",
  "ARI","LAR","SF","SEA"
];

// Weeks
const weeks = Array.from({length:18}, (_,i)=>"W"+(i+1));

// Build header
const table = document.getElementById("grid");
const headerRow = table.querySelector("thead tr");

weeks.forEach(w=>{
  const th = document.createElement("th");
  th.textContent = w;
  th.className = "p-2 border";
  headerRow.appendChild(th);
});

const tbody = table.querySelector("tbody");

// Store schedule data
let schedule = {};

// initialize
teams.forEach(t=>{
  schedule[t] = {};
  weeks.forEach(w => schedule[t][w]="");
});

// Render table
function render(filter="") {
  tbody.innerHTML = "";

  teams
    .filter(t => t.toLowerCase().includes(filter.toLowerCase()))
    .forEach(team => {
      const tr = document.createElement("tr");

      // Team column
      const tdTeam = document.createElement("td");
      tdTeam.textContent = team;
      tdTeam.className = "p-2 border font-bold bg-gray-100";
      tr.appendChild(tdTeam);

      weeks.forEach(w=>{
        const td = document.createElement("td");
        td.className = "p-1 border";

        const input = document.createElement("input");
        input.value = schedule[team][w];
        input.className = "w-20 p-1 text-xs border rounded text-center";

        // color logic (matches Excel)
        function updateColor() {
          const v = input.value.trim();

          input.classList.remove("home","away","bye");

          if(v.startsWith("v")) input.classList.add("home");
          else if(v.startsWith("a")) input.classList.add("away");
          else if(v.toUpperCase() === "BYE") input.classList.add("bye");
        }

        updateColor();

        input.addEventListener("input", e=>{
          schedule[team][w] = e.target.value;
          updateColor();
        });

        td.appendChild(input);
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });
}

render();

// search
document.getElementById("search").addEventListener("input", e=>{
  render(e.target.value);
});
</script>

</body>
</html>
