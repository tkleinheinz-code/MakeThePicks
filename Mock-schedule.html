<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>2026 Mock Schedule Grid</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .home { background: #d1fae5; }
    .away { background: #fee2e2; }
    .bye  { background: #e5e7eb; }
  </style>
</head>

<body class="p-6 bg-gray-100">

<h1 class="text-3xl font-bold mb-4">2026 Mock Schedule Grid</h1>

<input id="search" class="mb-4 p-2 border rounded w-64"
 placeholder="Search team..." />

<div class="overflow-auto border bg-white">
<table class="min-w-full text-sm text-center" id="grid">
  <thead class="bg-gray-300 sticky top-0">
    <tr>
      <th class="p-2 border">Team</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
</div>

<script>

// ✅ REQUIRED: teams array
const teams = [
  "BUF","MIA","NE","NYJ","BAL","CIN","CLE","PIT",
  "HOU","IND","JAX","TEN","DEN","KC","LV","LAC",
  "DAL","NYG","PHI","WAS","CHI","DET","GB","MIN",
  "ATL","CAR","NO","TB","ARI","LAR","SF","SEA"
];

const logos = {};
teams.forEach(t=>{
  logos[t] = `https://a.espncdn.com/i/teamlogos/nfl/500/${t.toLowerCase() === "was" ? "wsh" : t.toLowerCase()}.png`;
});

const weeks = Array.from({length:18}, (_,i)=>"W"+(i+1));

const table = document.getElementById("grid");
const headerRow = table.querySelector("thead tr");

// Build header
weeks.forEach(w=>{
  const th = document.createElement("th");
  th.textContent = w;
  th.className = "p-2 border";
  headerRow.appendChild(th);
});

// Data store
let schedule = {};
teams.forEach(t=>{
  schedule[t] = {};
  weeks.forEach(w => schedule[t][w]="");
});

const tbody = table.querySelector("tbody");

// Helpers
function getOpposite(value, team) {
  if(value.startsWith("v")) return "a"+team;
  if(value.startsWith("a")) return "v"+team;
  return "";
}

function getColorClass(value) {
  if(value.startsWith("v")) return "home";
  if(value.startsWith("a")) return "away";
  if(value === "BYE") return "bye";
  return "";
}

// Create cell
function createCell(team, week) {
  const td = document.createElement("td");
  td.className = "p-1 border";

  const value = schedule[team][week];

  // ✅ DISPLAY MODE (already filled)
  if(value) {

    const container = document.createElement("div");
    container.className = "flex items-center justify-center gap-1 cursor-pointer p-1 rounded";

    // color
    const cls = getColorClass(value);
    if(cls) container.classList.add(cls);

    if(value === "BYE") {
      container.textContent = "BYE";
    } else {
      const opponent = value.substring(1);

      const img = document.createElement("img");
      img.src = logos[opponent];
      img.className = "w-5 h-5";

      const span = document.createElement("span");
      span.className = "text-xs font-bold";
      span.textContent = opponent;

      container.appendChild(img);
      container.appendChild(span);
    }

    // ✅ click to edit
    container.onclick = () => {
      schedule[team][week] = "";
      render(document.getElementById("search").value);
    };

    td.appendChild(container);
    return td;
  }

  // ✅ EDIT MODE (empty cell)
  const wrapper = document.createElement("div");
  wrapper.className = "flex flex-col gap-1";

  const typeSelect = document.createElement("select");
  typeSelect.className = "text-xs border rounded";

  ["","v","a","BYE"].forEach(opt=>{
    const o = document.createElement("option");
    o.value = opt;
    o.textContent = opt==="v"?"Home":opt==="a"?"Away":opt==="BYE"?"BYE":"-";
    typeSelect.appendChild(o);
  });

  const dropdown = document.createElement("div");
  dropdown.className = "relative";

  const button = document.createElement("button");
  button.type = "button";
  button.dataset.value = "";
  button.className = "text-xs border rounded w-full flex items-center gap-1 px-1 py-1 bg-white";
  button.textContent = "Team";

  const menu = document.createElement("div");
  menu.className = "absolute bg-white border rounded shadow-md hidden z-10 max-h-40 overflow-auto w-28";

  teams.forEach(t=>{
    const item = document.createElement("div");
    item.className = "flex items-center gap-2 px-2 py-1 hover:bg-gray-100 cursor-pointer";

    const img = document.createElement("img");
    img.src = logos[t];
    img.className = "w-4 h-4";

    const span = document.createElement("span");
    span.textContent = t;

    item.appendChild(img);
    item.appendChild(span);

    item.onclick = () => {
      button.innerHTML = `<img src="${logos[t]}" class="w-4 h-4"/> ${t}`;
button.dataset.value = t;

// ✅ force immediate update
updateValue();
    };

    menu.appendChild(item);
  });

  button.onclick = ()=> menu.classList.toggle("hidden");

  dropdown.appendChild(button);
  dropdown.appendChild(menu);

function updateValue() {
  let val = "";

  // ✅ AUTO DEFAULT to Home if not selected
  if(!typeSelect.value && button.dataset.value) {
    typeSelect.value = "v";
  }

  if(typeSelect.value === "BYE") {
    val = "BYE";
  } else if(typeSelect.value && button.dataset.value) {
    val = typeSelect.value + button.dataset.value;
  }

  // ✅ If still nothing, stop
  if(!val) return;

  schedule[team][week] = val;

  // ✅ AUTO SYNC opponent
  if(val.startsWith("v") || val.startsWith("a")) {
    const opponent = button.dataset.value;
    const opposite = getOpposite(val, team);

    if(opponent && teams.includes(opponent)) {
      schedule[opponent][week] = opposite;
    }
  }

  // ✅ Re-render AFTER saving
  render(document.getElementById("search").value);
}

  typeSelect.onchange = updateValue;

  wrapper.appendChild(typeSelect);
  wrapper.appendChild(dropdown);

  td.appendChild(wrapper);
  return td;
}

// Render
function render(filter="") {
  tbody.innerHTML = "";

  teams
    .filter(t => t.toLowerCase().includes(filter.toLowerCase()))
    .forEach(team=>{
      const tr = document.createElement("tr");

      const tdTeam = document.createElement("td");
      tdTeam.textContent = team;
      tdTeam.className = "p-2 border font-bold bg-gray-100";

      tr.appendChild(tdTeam);

      weeks.forEach(w=>{
        tr.appendChild(createCell(team, w));
      });

      tbody.appendChild(tr);
    });
}

render();

// Search
document.getElementById("search").oninput = e=>{
  render(e.target.value);
};

</script>

</body>
</html>
