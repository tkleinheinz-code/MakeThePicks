<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draft Rooms | Make The Picks</title>
<link rel="stylesheet" href="styles.css">

<style>

/* Layout */
.container {
  max-width: 900px;
  margin: 40px auto;
}

/* Sections */
.section {
  background: #111;
  border: 1px solid #333;
  padding: 20px;
  margin-bottom: 20px;
}

/* Titles */
.section h2 {
  margin-bottom: 12px;
  color: #ffd77a;
}

/* Inputs */
input {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  background: #000;
  border: 1px solid #333;
  color: #fff;
}

/* Row buttons */
.row {
  display: flex;
  gap: 10px;
}

/* Draft list */
.draft-list {
  list-style: none;
  padding: 0;
}

.draft-list li {
  padding: 10px;
  border-bottom: 1px solid #333;
}
  
/* Checkbox label alignment */
.checkbox-row {
  display: flex;
  align-items: center;   /* ✅ vertical alignment fix */
  gap: 4px;              /* ✅ space between box and text */
  margin-bottom: 6px;
}

/* Optional: make checkbox slightly smaller/cleaner */
.checkbox-row input {
  margin: 0;
}

  /* Toggle container */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  color: #ccc;
}

/* Switch wrapper */
.switch {
  position: relative;
  display: inline-block;
  width: 44px;
  height: 24px;
}

/* Hide default checkbox */
.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

/* Slider */
.slider {
  position: absolute;
  cursor: pointer;
  background-color: #333;
  border-radius: 34px;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  transition: 0.3s;
}

/* Circle */
.slider:before {
  position: absolute;
  content: "";
  height: 18px;
  width: 18px;
  left: 3px;
  bottom: 3px;
  background-color: #fff;
  border-radius: 50%;
  transition: 0.3s;
}

/* ON state */
.switch input:checked + .slider {
  background-color: #ffd77a;
}

/* Move circle */
.switch input:checked + .slider:before {
  transform: translateX(20px);
}
  .switch:hover .slider {
  box-shadow: 0 0 4px #ffd77a;
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">
    <a href="index.html">MAKE THE PICKS</a>
  </div>
</header>

<main class="container">

  <!-- CREATE ROOM -->
  <div class="section">
    <h2>Create a Mock Draft Room</h2>

    <input type="text" id="roomName" placeholder="Enter Room Name">

<!-- Room Options -->
<div style="margin-top:10px;">

  <div class="toggle-row">
    <span>Include Expert's Mock Drafts</span>
    <label class="switch">
      <input type="checkbox" id="includeExperts" onchange="toggleExperts()">
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span>Require Password</span>
    <label class="switch">
      <input type="checkbox" id="requirePassword" onchange="togglePassword()">
      <span class="slider"></span>
    </label>
  </div>

</div>

<!-- Expert selection (hidden by default) -->
<div id="expertBox" style="display:none; margin-top:10px;">
  <p>Select Experts:</p>

  <label><input type="checkbox" value="Mel Kiper"> Mel Kiper</label><br>
  <label><input type="checkbox" value="Todd McShay"> Todd McShay</label><br>
  <label><input type="checkbox" value="Daniel Jeremiah"> Daniel Jeremiah</label><br>
  <label><input type="checkbox" value="Peter Schrager"> Peter Schrager</label><br>
  <label><input type="checkbox" value="Lance Zierlein"> Lance Zierlein</label>
</div>

<!-- Password field (hidden by default) -->
<div id="passwordBox" style="display:none; margin-top:10px;">
  <input type="password" id="roomPassword" placeholder="Enter room password">
</div>

    <button class="cta-button" onclick="createRoom()">
      Create Room
    </button>

    <p id="roomCodeDisplay" style="margin-top:10px;"></p>
  </div>

  <!-- JOIN ROOM -->
  <div class="section">
    <h2>Join a Mock Room</h2>

    <input type="text" id="joinCode" placeholder="Enter Room Code">

    <button class="cta-button" onclick="joinRoom()">
      Join Room
    </button>
  </div>

  <!-- ACTIVE ROOM -->
  <div class="section" id="activeRoom" style="display:none;">
    <h2 id="roomTitle"></h2>

    <p><strong>Room Code:</strong> <span id="roomCode"></span></p>

    <h3>Mock Drafts</h3>

    <ul class="draft-list" id="draftList">
      <li>No drafts submitted yet</li>
    </ul>
  </div>

</main>

<script>

// Create unique room code
function generateCode() {
  return Math.random().toString(36).substring(2, 8).toUpperCase();
}

// Create Room
function createRoom() {
  const name = document.getElementById('roomName').value;
  if (!name) return;

  const code = generateCode();

  const includeExperts = document.getElementById('includeExperts').checked;
  const requirePassword = document.getElementById('requirePassword').checked;
  const password = document.getElementById('roomPassword').value;

  // Get selected experts
  let selectedExperts = [];
  if (includeExperts) {
    document.querySelectorAll('#expertBox input:checked').forEach(cb => {
      selectedExperts.push(cb.value);
    });
  }

  const room = {
    name: name,
    code: code,
    drafts: [],
    includeExperts: includeExperts,
    experts: selectedExperts,
    requirePassword: requirePassword,
    password: requirePassword ? password : null
  };

  localStorage.setItem(code, JSON.stringify(room));

  document.getElementById('roomCodeDisplay').textContent =
    "Room Created! Code: " + code;

  loadRoom(room);
}


// Join Room
function joinRoom() {
  const code = document.getElementById('joinCode').value.toUpperCase();
  const room = JSON.parse(localStorage.getItem(code));

  if (!room) {
    alert("Room not found");
    return;
  }

  // ✅ Check password if required
  if (room.requirePassword) {
    const input = prompt("Enter room password:");
    if (input !== room.password) {
      alert("Incorrect password");
      return;
    }
  }

  loadRoom(room);
}

// Load Room Info
function loadRoom(room) {
  document.getElementById('activeRoom').style.display = "block";

  document.getElementById('roomTitle').textContent = room.name;
  document.getElementById('roomCode').textContent = room.code;

  const draftList = document.getElementById('draftList');
  draftList.innerHTML = "";

  if (room.drafts.length === 0) {
    draftList.innerHTML = "<li>No drafts submitted yet</li>";
  } else {
    room.drafts.forEach(draft => {
      const li = document.createElement('li');
      li.textContent = draft;
      draftList.appendChild(li);
    });
  }
}

  // Show/hide expert selection
function toggleExperts() {
  const box = document.getElementById('expertBox');
  box.style.display = document.getElementById('includeExperts').checked ? 'block' : 'none';
}

// Show/hide password field
function togglePassword() {
  const box = document.getElementById('passwordBox');
  box.style.display = document.getElementById('requirePassword').checked ? 'block' : 'none';
}
</script>

</body>
</html>
