<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>2026 Mock Schedule Grid</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .home { background: #d1fae5; }
    .away { background: #fee2e2; }
    .bye  { background: #e5e7eb; }

    .sticky-col {
      position: sticky;
      left: 0;
      background: #f3f4f6;
      z-index: 20;
    }
  </style>
</head>

<body class="p-6 bg-gray-100">

<h1 class="text-3xl font-bold mb-4">2026 Mock Schedule Grid</h1>

<input id="search" class="mb-4 p-2 border rounded w-64"
 placeholder="Search team..." />

<div class="overflow-auto border bg-white">
<table class="min-w-full text-sm text-center" id="grid">
  <thead class="bg-gray-300 sticky top-0 z-30">
    <tr>
      <th class="p-2 border sticky-col">Team</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
</div>

<script>

// ✅ Teams
const teams = [
  "BUF","MIA","NE","NYJ","BAL","CIN","CLE","PIT",
  "HOU","IND","JAX","TEN","DEN","KC","LV","LAC",
  "DAL","NYG","PHI","WAS","CHI","DET","GB","MIN",
  "ATL","CAR","NO","TB","ARI","LAR","SF","SEA"
];

// ✅ YOUR EXCEL-CONVERTED DATA
const rawScheduleData = {
  BUF: ["vMIA","vNE","vNYJ","aBAL","aKC","aDAL","vCHI"],
  MIA: ["aBUF","vNE","vNYJ","aSF","aSEA","vDEN"],
  NE:  ["aBUF","aMIA","vNYJ","aKC","vLV","vPHI"],
  NYJ: ["aBUF","aMIA","aNE","vIND","vDAL","aSF"],

  BAL: ["vCIN","vCLE","vPIT","aBUF","vKC"],
  CIN: ["aBAL","vCLE","vPIT","aTEN","vDEN"],
  CLE: ["aBAL","aCIN","vPIT","vNYG"],
  PIT: ["aBAL","aCIN","aCLE","vPHI"],

  HOU: ["vIND","vJAX","vTEN"],
  IND: ["aHOU","vJAX","vTEN"],
  JAX: ["aHOU","aIND","vTEN"],
  TEN: ["aHOU","aIND","aJAX"],

  DEN: ["vKC","vLV","vLAC"],
  KC: ["aDEN","vLV","vLAC"],
  LV: ["aDEN","aKC","vLAC"],
  LAC: ["aDEN","aKC","aLV"],

  DAL: ["vNYG","vPHI","vWAS","aBUF","aBAL"],
  NYG: ["aDAL","vPHI","vWAS"],
  PHI: ["aDAL","aNYG","vWAS"],
  WAS: ["aDAL","aNYG","aPHI"],

  CHI: ["vDET","vGB","vMIN","aBUF"],
  DET: ["aCHI","vGB","vMIN","aPIT"],
  GB: ["aCHI","aDET","vMIN","aLAC"],
  MIN: ["aCHI","aDET","aGB","vLV"],

  ATL: ["vCAR","vNO","vTB","aHOU"],
  CAR: ["aATL","vNO","vTB","aTEN"],
  NO: ["aATL","aCAR","vTB","aJAX"],
  TB: ["aATL","aCAR","aNO"],

  ARI: ["vLAR","vSF","vSEA"],
  LAR: ["aARI","vSF","vSEA"],
  SF: ["aARI","aLAR","vSEA"],
  SEA: ["aARI","aLAR","aSF"]
};

// ✅ Build valid opponent list
const validOpponents = {};
Object.keys(rawScheduleData).forEach(team => {
  validOpponents[team] = rawScheduleData[team]
    .filter(g => g.startsWith("v") || g.startsWith("a"))
    .map(g => g.substring(1));
});

// ✅ Logos
const logos = {};
teams.forEach(t => {
  logos[t] = `https://a.espncdn.com/i/teamlogos/nfl/500/${
    t === "WAS" ? "wsh" : t.toLowerCase()
  }.png`;
});

// ✅ Weeks
const weeks = Array.from({length:18}, (_,i)=>"W"+(i+1));

// Build header
const table = document.getElementById("grid");
const headerRow = table.querySelector("thead tr");

weeks.forEach(w=>{
  const th=document.createElement("th");
  th.textContent=w;
  th.className="p-2 border";
  headerRow.appendChild(th);
});

// ✅ Schedule storage
let schedule = {};
teams.forEach(t=>{
  schedule[t]={};
  weeks.forEach(w=>schedule[t][w]="");
});

const tbody = table.querySelector("tbody");

// ✅ Helpers
function getOpposite(val, team){
  return val.startsWith("v") ? "a"+team :
         val.startsWith("a") ? "v"+team : "";
}

// ✅ Cell creation
function createCell(team, week){
  const td=document.createElement("td");
  const val=schedule[team][week];

  // DISPLAY MODE
  if(val){
    const d=document.createElement("div");
    d.className="cursor-pointer p-1";

    if(val==="BYE"){
      d.textContent="BYE";
    } else {
      const opp=val.substring(1);
      const isHome=val.startsWith("v");
      d.innerHTML=`<img src="${logos[opp]}" class="w-5 d.onclick=()=>{
      schedule[team][week]="";
      render();
    };

    td.appendChild(d);
    return td;
  }

  // EDIT MODE
  const btn=document.createElement("button");
  btn.textContent="Pick";

  const menu=document.createElement("div");
  menu.className="absolute bg-white border hidden";

  (validOpponents[team] || []).forEach(t=>{
    const item=document.createElement("div");
    item.className="p-1 cursor-pointer hover:bg-gray-100";
    item.innerHTML=`<img src="${logos[t]}" class="w-4ick=()=>{
      schedule[team][week]="v"+t;
      schedule[t][week]="a"+team;
      render();
    };

    menu.appendChild(item);
  });

  btn.onclick=()=>menu.classList.toggle("hidden");

  td.appendChild(btn);
  td.appendChild(menu);
  return td;
}

// ✅ Render
function render(){
  tbody.innerHTML="";

  teams.forEach(team=>{
    const tr=document.createElement("tr");

    const td=document.createElement("td");
    td.textContent=team;
    td.className="sticky-col font-bold bg-gray-100";
    tr.appendChild(td);

    weeks.forEach(w=>tr.appendChild(createCell(team,w)));

    tbody.appendChild(tr);
  });
}

render();

</script>

</body>
</html>
