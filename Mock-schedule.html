<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>2026 Mock Schedule Grid</title>

  <script src="https://cdn.tailwindcss

  <style>
    .sticky-col {
      position: sticky;
      left: 0;
      background: #f3f4f6;
      z-index: 20;
    }
  </style>
</head>

<body class="p-6 bg-gray-100">

<h1 class="text-3xl font-bold mb-4">2026 Mock Schedule Grid</h1>

<div class="overflow-auto border bg-white">
<table class="min-w-full text-sm text-center" id="grid">
  <thead class="bg-gray-300 sticky top-0 z-30">
    <tr>
      <th class="p-2 border sticky-col">Team</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
</div>

<script>

// ✅ TEAMS
const teams = ["BUF","MIA","NE","NYJ"];

// ✅ SIMPLE VALID OPPONENTS
const validOpponents = {
  BUF:["MIA","NE","NYJ"],
  MIA:["BUF","NE","NYJ"],
  NE:["BUF","MIA","NYJ"],
  NYJ:["BUF","MIA","NE"]
};

// ✅ LOGOS
const logos = {};
teams.forEach(t=>{
  logos[t] = `https://a.espncdn.com/i/teamlogos/nfl/500/${t.toLowerCase()}.png`;
});

// ✅ WEEKS
const weeks = ["W1","W2","W3","W4"];

// ✅ HEADER
const headerRow = document.querySelector("#grid thead tr");
weeks.forEach(w=>{
  const th = document.createElement("th");
  th.textContent = w;
  th.className = "border";
  headerRow.appendChild(th);
});

// ✅ DATA STORE
let schedule = {};
teams.forEach(t=>{
  schedule[t]={};
  weeks.forEach(w=>schedule[t][w]="");
});

const tbody=document.querySelector("#grid tbody");

// ✅ CREATE CELL
function createCell(team,week){

  const td=document.createElement("td");
  const val=schedule[team][week];

  // DISPLAY
  if(val){
    const d=document.createElement("div");

    const opp = val.substring(1);
    const isHome = val.startsWith("v");

    d.innerHTML = `<img src="${logos[opp]}" class="w-{opp}`;

    d.onclick = ()=>{
      schedule[team][week]="";
      render();
    };

    td.appendChild(d);
    return td;
  }

  // EDIT
  const btn=document.createElement("button");
  btn.textContent="Pick";

  const menu=document.createElement("div");
  menu.className="absolute bg-white border hidden";

  validOpponents[team].forEach(t=>{
    const item=document.createElement("div");

    item.innerHTML = `<img src="${logos[t]}" class="w-4 inlineursor-pointer hover:bg-gray-200 p-1";

    item.onclick = ()=>{
      schedule[team][week]="v"+t;
      schedule[t][week]="a"+team;
      render();
    };

    menu.appendChild(item);
  });

  btn.onclick=()=>menu.classList.toggle("hidden");

  td.appendChild(btn);
  td.appendChild(menu);

  return td;
}

// ✅ RENDER
function render(){
  tbody.innerHTML="";

  teams.forEach(team=>{
    const tr=document.createElement("tr");

    const td=document.createElement("td");
    td.textContent=team;
    td.className="sticky-col font-bold";
    tr.appendChild(td);

    weeks.forEach(w=>{
      tr.appendChild(createCell(team,w));
    });

    tbody.appendChild(tr);
  });
}

// ✅ START
render();

</script>

</body>
</html>
