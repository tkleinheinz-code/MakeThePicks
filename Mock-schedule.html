<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>2026 Mock Schedule Grid</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .home { background: #d1fae5; }
    .away { background: #fee2e2; }
    .bye  { background: #e5e7eb; }

    .sticky-col {
      position: sticky;
      left: 0;
      background: #f3f4f6;
      z-index: 20;
    }
  </style>
</head>

<body class="p-6 bg-gray-100">

<h1 class="text-3xl font-bold mb-4">2026 Mock Schedule Grid</h1>

<input id="search" class="mb-4 p-2 border rounded w-64"
 placeholder="Search team..." />

<div class="overflow-auto border bg-white">
<table class="min-w-full text-sm text-center" id="grid">
  <thead class="bg-gray-300 sticky top-0 z-30">
    <tr>
      <th class="p-2 border sticky-col">Team</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
</div>

<script>

// ✅ Teams
const teams = [
  "BUF","MIA","NE","NYJ","BAL","CIN","CLE","PIT",
  "HOU","IND","JAX","TEN","DEN","KC","LV","LAC",
  "DAL","NYG","PHI","WAS","CHI","DET","GB","MIN",
  "ATL","CAR","NO","TB","ARI","LAR","SF","SEA"
];

// ✅ ✅ PASTE YOUR EXCEL VALUES HERE (trimmed example – expand as needed)
const rawScheduleData = {
  BUF: ["vMIA","vNE","vNYJ","aBAL","aKC","aDAL","vCHI"],
  MIA: ["aBUF","vNE","vNYJ","aSF","aSEA","vDEN"],
  NE:  ["aBUF","aMIA","vNYJ","aKC","vLV","vPHI"],
  NYJ: ["aBUF","aMIA","aNE","vIND","vDAL","aSF"],

  BAL: ["vCIN","vCLE","vPIT","aBUF","vKC"],
  CIN: ["aBAL","vCLE","vPIT","aTEN","vDEN"],
  CLE: ["aBAL","aCIN","vPIT","vNYG"],
  PIT: ["aBAL","aCIN","aCLE","vPHI"],

  HOU: ["vIND","vJAX","vTEN","aBUF"],
  IND: ["aHOU","vJAX","vTEN","aNYJ"],
  JAX: ["aHOU","aIND","vTEN","vNO"],
  TEN: ["aHOU","aIND","aJAX","vTB"],

  DEN: ["vKC","vLV","vLAC","aCHI"],
  KC: ["aDEN","vLV","vLAC","aBUF"],
  LV: ["aDEN","aKC","vLAC","aNE"],
  LAC: ["aDEN","aKC","aLV","vJAX"],

  DAL: ["vNYG","vPHI","vWAS","aBUF","aBAL"],
  NYG: ["aDAL","vPHI","vWAS","aCLE"],
  PHI: ["aDAL","aNYG","vWAS","vKC"],
  WAS: ["aDAL","aNYG","aPHI","vARI"],

  CHI: ["vDET","vGB","vMIN","aBUF"],
  DET: ["aCHI","vGB","vMIN","aPIT"],
  GB: ["aCHI","aDET","vMIN","aLAC"],
  MIN: ["aCHI","aDET","aGB","vLV"],

  ATL: ["vCAR","vNO","vTB","aHOU"],
  CAR: ["aATL","vNO","vTB","aTEN"],
  NO: ["aATL","aCAR","vTB","aJAX"],
  TB: ["aATL","aCAR","aNO","aTEN"],

  ARI: ["vLAR","vSF","vSEA","aCAR"],
  LAR: ["aARI","vSF","vSEA","aMIA"],
  SF: ["aARI","aLAR","vSEA","vNO"],
  SEA: ["aARI","aLAR","aSF","vIND"]
};

  const validOpponents = {};

Object.entries(rawScheduleData).forEach(([team, games]) => {
  validOpponents[team] = [];

  games.forEach(g => {
    if (g.startsWith("v") || g.startsWith("a")) {
      const opp = g.substring(1);
      if (!validOpponents[team].includes(opp)) {
        validOpponents[team].push(opp);
      }
    }
  });
});


// ✅ ✅ Build validOpponents dynamically
const validOpponents = {};

teams.forEach(team => {
  validOpponents[team] = [];
});

Object.entries(rawScheduleData).forEach(([team, games]) => {
  games.forEach(game => {
    if(game.startsWith("v") || game.startsWith("a")) {
      const opponent = game.substring(1);

      if(!validOpponents[team].includes(opponent)) {
        validOpponents[team].push(opponent);
      }
    }
  });
});

// ✅ Logos
const logos = {};
teams.forEach(t => {
  logos[t] = `https://a.espncdn.com/i/teamlogos/nfl/500/${
    t === "WAS" ? "wsh" : t.toLowerCase()
  }.png`;
});

// ✅ Weeks
const weeks = Array.from({length:18}, (_,i)=>"W"+(i+1));

const table = document.getElementById("grid");
const headerRow = table.querySelector("thead tr");

weeks.forEach(w=>{
  const th = document.createElement("th");
  th.textContent = w;
  th.className = "p-2 border";
  headerRow.appendChild(th);
});

// ✅ Schedule storage
let schedule = {};
teams.forEach(t=>{
  schedule[t] = {};
  weeks.forEach(w => schedule[t][w]="");
});

const tbody = table.querySelector("tbody");

// Helpers
function getOpposite(value, team) {
  if(value.startsWith("v")) return "a"+team;
  if(value.startsWith("a")) return "v"+team;
  return "";
}

function getColorClass(value) {
  if(value.startsWith("v")) return "home";
  if(value.startsWith("a")) return "away";
  if(value === "BYE") return "bye";
  return "";
}

// ✅ Cell renderer
function createCell(team, week) {

  const td = document.createElement("td");
  const value = schedule[team][week];

  // DISPLAY
  if(value){
    const c=document.createElement("div");
    c.className="p-1 cursor-pointer";

    if(value==="BYE"){
      c.textContent="BYE";
    }else{
      const opp=value.substring(1);
      c.innerHTML=`<img src="${logos[opp]}" class="w-5 inline:"@"} ${opp}`;
    }

    c.onclick=()=>{
      schedule[team][week]="";
      render();
    };

    td.appendChild(c);
    return td;
  }

  // EDIT
  const btn=document.createElement("button");
  btn.textContent="Pick";

  const menu=document.createElement("div");
  menu.className="absolute bg-white border hidden";

  (validOpponents[team] || []).forEach(t=>{
    const item=document.createElement("div");
    item.innerHTML=`<img src="${logos[t]}" class="w-4 inline>{
      schedule[team][week]="v"+t;
      schedule[t][week]="a"+team;
      render();
    };

    menu.appendChild(item);
  });

  btn.onclick=()=>menu.classList.toggle("hidden");

  td.appendChild(btn);
  td.appendChild(menu);
  return td;
}

// Render
function render(){
  tbody.innerHTML="";
  teams.forEach(team=>{
    const tr=document.createElement("tr");

    const td=document.createElement("td");
    td.textContent=team;
    td.className="sticky-col";
    tr.appendChild(td);

    weeks.forEach(w=>tr.appendChild(createCell(team,w)));

    tbody.appendChild(tr);
  });
}

render();

</script>

</body>
</html>
