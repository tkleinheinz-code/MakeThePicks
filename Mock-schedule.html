// ✅ LOGOS
const logos = {};
teams.forEach(t=>{
  logos[t] = "https://a.espncdn.com/i/teamlogos/nfl/500/" +
    (t === "WAS" ? "wsh" : t.toLowerCase()) + ".png";
});

// ✅ WEEKS
const weeks = Array.from({length:18}, (_,i)=>"W"+(i+1));

// ✅ HEADER
const headerRow = document.querySelector("#grid thead tr");
weeks.forEach(w=>{
  const th = document.createElement("th");
  th.textContent = w;
  th.className = "border p-1";
  headerRow.appendChild(th);
});

// ✅ DATA STORE
let schedule = {};
teams.forEach(t=>{
  schedule[t] = {};
  weeks.forEach(w=>schedule[t][w] = "");
});

const tbody = document.querySelector("#grid tbody");

// ✅ CREATE CELL
function createCell(team,week){

  const td = document.createElement("td");
  td.className="border p-1";

  const val = schedule[team][week];

  // DISPLAY
  if(val){
    const d = document.createElement("div");

    const opp = val.substring(2);
    const isHome = val.startsWith("v");

    const img = document.createElement("img");
    img.src = logos[opp];
    img.className="w-5 inline";

    d.appendChild(img);
    d.appendChild(document.createTextNode(" " + (isHome?"vs ":"@ ") + opp));

    d.className = isHome ? "home cursor-pointer" : "away cursor-pointer";

    d.onclick = ()=>{
      schedule[team][week] = "";
      render();
    };

    td.appendChild(d);
    return td;
  }

  // EDIT
  const btn = document.createElement("button");
  btn.textContent="Pick";
  btn.className="text-xs border px-1";

  const menu = document.createElement("div");
  menu.className="absolute bg-white border hidden";

  (validOpponents[team] || []).forEach(t=>{

    const item = document.createElement("div");
    item.className="px-2 hover:bg-gray-200 cursor-pointer";

    const img = document.createElement("img");
    img.src = logos[t];
    img.className="w-4 inline";

    item.appendChild(img);
    item.appendChild(document.createTextNode(" "+t));

    item.onclick = ()=>{
      schedule[team][week] = "v " + t;
      schedule[t][week] = "@ " + team;
      render();
    };

    menu.appendChild(item);
  });

  btn.onclick = ()=>menu.classList.toggle("hidden");

  td.appendChild(btn);
  td.appendChild(menu);

  return td;
}

// ✅ RENDER
function render(){
  tbody.innerHTML="";

  teams.forEach(team=>{
    const tr=document.createElement("tr");

    // TEAM COLUMN
    const td=document.createElement("td");
    td.className="sticky-col font-bold border";

    const img = document.createElement("img");
    img.src = logos[team];
    img.className="w-6 inline";

    td.appendChild(img);
    td.appendChild(document.createTextNode(" "+team));

    tr.appendChild(td);

    // WEEKS
    weeks.forEach(w=>{
      tr.appendChild(createCell(team,w));
    });

    tbody.appendChild(tr);
  });
}

render();

</script>
</body>
</html>
