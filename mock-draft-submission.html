<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit Mock Draft | Make The Picks</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="header">
  <div class="logo">MAKE THE PICKS</div>
</header>

<main class="content">

  <h1>MOCK DRAFT</h1>

  <form class="mock-draft-grid">

    <!-- HEADER ROW -->
    <div class="grid-header">PICK</div>
    <div class="grid-header">TEAM</div>
    <div class="grid-header">PLAYER</div>
    <div class="grid-header">TRADE TO</div>

    <!-- PICKS 1–32 -->
    <!-- Repeat this block for picks 1–32 -->

    <!-- Example: Pick 1 -->
    <div class="pick-number">1</div>

    <select>
      <option value="">Select Team</option>
      <option>Arizona Cardinals</option>
      <option>Atlanta Falcons</option>
      <option>Baltimore Ravens</option>
      <option>Buffalo Bills</option>
      <option>Carolina Panthers</option>
      <!-- add all 32 teams -->
    </select>

    <select>
      <option value="">Select Player</option>
      <option>Player One – QB</option>
      <option>Player Two – EDGE</option>
      <option>Player Three – OT</option>
      <!-- replace later with real 2027 prospects -->
    </select>

    <select>
      <option value="">Select Team</option>
      <option>Arizona Cardinals</option>
      <option>Atlanta Falcons</option>
      <option>Baltimore Ravens</option>
      <option>Buffalo Bills</option>
      <option>Carolina Panthers</option>
    </select>

    <!-- Copy block above and increment pick-number to 32 -->

  </form>

  <div class="submit-row">
    <button class="cta-button">SUBMIT YOUR MOCK DRAFT</button>
  </div>

</main>

<footer class="footer">
  © Make The Picks
</footer>

</body>
</html>
