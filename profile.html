<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile | Make The Picks</title>
<link rel="stylesheet" href="styles.css">

<style>

/* Layout */
.profile-container {
  max-width: 1000px;
  margin: 40px auto;
}

/* Top Section */
.profile-top {
  display: flex;
  gap: 24px;
}

/* Photo box */
.profile-photo {
  width: 150px;
}

.profile-photo img {
  width: 100%;
  border: 2px solid #333;
}

.profile-photo input {
  margin-top: 10px;
}

/* Right side info */
.profile-info {
  flex: 1;
}

/* Name */
.profile-name {
  font-size: 28px;
  margin-bottom: 12px;
  background: transparent;
  border: none;
  color: #fff;
  font-weight: bold;
  width: 100%;
}

/* Subtle underline on focus */
.profile-name:focus {
  outline: none;
  border-bottom: 2px solid #ffd77a;
}

/* Bio */
.profile-bio {
  width: 100%;
  height: 100px;
  padding: 10px;
  background: #000;
  border: 1px solid #333;
  color: #fff;
  margin-bottom: 20px;
}

/* Buttons */
.profile-actions {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 220px;
}

/* Bottom section */
.past-drafts {
  margin-top: 48px;
}

.past-drafts h2 {
  margin-bottom: 16px;
  color: #ffd77a;
}

/* Placeholder list */
.past-drafts ul {
  list-style: none;
  padding: 0;
}

.past-drafts li {
  padding: 10px;
  border-bottom: 1px solid #333;
}

</style>
</head>

<body>

<header class="header">
  <div class="logo">
    <a href="index.html">MAKE THE PICKS</a>
  </div>
</header>

<main class="content profile-container">

  <!-- TOP SECTION -->
  <div class="profile-top">

    <!-- Photo -->
    <div class="profile-photo">
      <img id="profilePreview" src="" alt="Profile Photo">
      <input type="file" id="photoUpload" accept="image/*">
    </div>

    <!-- Info -->
    <div class="profile-info">

    <input
  type="text" 
  class="profile-name" 
  id="profileName" 
  value="Your Name"
/>

      <textarea class="profile-bio" placeholder="Add a short bio..."></textarea>

      <div class="profile-actions">
        <button class="cta-button" onclick="location.href='drag-draft.html'TEAM
        </button>
      </div>

    </div>

  </div>

  <!-- BOTTOM SECTION -->
  <div class="past-drafts">
    <h2>Past Draft Picks</h2>

    <ul>
      <li>2026 Mock Draft – 87 Points</li>
      <li>2025 Mock Draft – 102 Points</li>
      <li>49ers Roster Build – Completed</li>
    </ul>

  </div>

</main>

<script>

/* ✅ Photo upload preview */
const photoUpload = document.getElementById('photoUpload');
const profilePreview = document.getElementById('profilePreview');

photoUpload.addEventListener('change', () => {
  const file = photoUpload.files[0];

  if (file) {
    profilePreview.src = URL.createObjectURL(file);
  }
});

</script>

</body>
</html>
