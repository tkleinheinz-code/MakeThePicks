<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>2026 Mock Schedule Grid</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .home { background: #d1fae5; }
    .away { background: #fee2e2; }
    .bye  { background: #e5e7eb; }

    .sticky-col {
      position: sticky;
      left: 0;
      background: #f3f4f6;
      z-index: 20;
    }
  </style>
</head>

<body class="p-6 bg-gray-100">

<h1 class="text-3xl font-bold mb-4">2026 Mock Schedule Grid</h1>

<input id="search" class="mb-4 p-2 border rounded w-64"
 placeholder="Search team..." />

<div class="overflow-auto border bg-white">
<table class="min-w-full text-sm text-center" id="grid">
  <thead class="bg-gray-300 sticky top-0 z-30">
    <tr>
      <th class="p-2 border sticky-col">Team</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
</div>

<script>

// ✅ Teams
const teams = [
  "BUF","MIA","NE","NYJ","BAL","CIN","CLE","PIT",
  "HOU","IND","JAX","TEN","DEN","KC","LV","LAC",
  "DAL","NYG","PHI","WAS","CHI","DET","GB","MIN",
  "ATL","CAR","NO","TB","ARI","LAR","SF","SEA"
];

// ✅ ✅ CUSTOM opponent lists (EDIT THIS TO MATCH YOUR FILE)
const validOpponents = {
  BUF: ["MIA","NE","NYJ","DAL","CHI","BAL","KC"],
  MIA: ["BUF","NE","NYJ","LAR","SEA","DEN"],
  NE: ["BUF","MIA","NYJ","KC","LV","PHI"],
  NYJ: ["BUF","MIA","NE","SF","DAL","IND"],

  BAL: ["CIN","CLE","PIT","BUF","KC","DAL"],
  CIN: ["BAL","CLE","PIT","DEN","TEN","JAX"],
  CLE: ["BAL","CIN","PIT","NYG","WAS"],
  PIT: ["BAL","CIN","CLE","PHI","DET"],

  HOU: ["IND","JAX","TEN","BUF","ATL"],
  IND: ["HOU","JAX","TEN","NYJ","SEA"],
  JAX: ["HOU","IND","TEN","LAC","NO"],
  TEN: ["HOU","IND","JAX","TB","CAR"],

  DEN: ["KC","LV","LAC","CHI","CIN"],
  KC: ["DEN","LV","LAC","BUF","PHI"],
  LV: ["DEN","KC","LAC","NE","MIN"],
  LAC: ["DEN","KC","LV","JAX","GB"],

  DAL: ["NYG","PHI","WAS","BUF","BAL"],
  NYG: ["DAL","PHI","WAS","CLE","SF"],
  PHI: ["DAL","NYG","WAS","KC","PIT"],
  WAS: ["DAL","NYG","PHI","ARI","DET"],

  CHI: ["DET","GB","MIN","BUF","DEN"],
  DET: ["CHI","GB","MIN","PIT","WAS"],
  GB: ["CHI","DET","MIN","LAC","SEA"],
  MIN: ["CHI","DET","GB","LV","ATL"],

  ATL: ["CAR","NO","TB","HOU","MIN"],
  CAR: ["ATL","NO","TB","TEN","ARI"],
  NO: ["ATL","CAR","TB","JAX","SF"],
  TB: ["ATL","CAR","NO","TEN","SEA"],

  ARI: ["LAR","SF","SEA","CAR","WAS"],
  LAR: ["ARI","SF","SEA","MIA","NYJ"],
  SF: ["ARI","LAR","SEA","NO","NYG"],
  SEA: ["ARI","LAR","SF","IND","GB"]
};

// ✅ Logos
const logos = {};
teams.forEach(t => {
  logos[t] = `https://a.espncdn.com/i/teamlogos/nfl/500/${
    t === "WAS" ? "wsh" : t.toLowerCase()
  }.png`;
});

// ✅ Weeks
const weeks = Array.from({length:18}, (_,i)=>"W"+(i+1));

// Table setup
const table = document.getElementById("grid");
const headerRow = table.querySelector("thead tr");

weeks.forEach(w=>{
  const th = document.createElement("th");
  th.textContent = w;
  th.className = "p-2 border";
  headerRow.appendChild(th);
});

// Data store
let schedule = {};
teams.forEach(t=>{
  schedule[t] = {};
  weeks.forEach(w => schedule[t][w]="");
});

const tbody = table.querySelector("tbody");

// Helpers
function getOpposite(value, team) {
  if(value.startsWith("v")) return "a"+team;
  if(value.startsWith("a")) return "v"+team;
  return "";
}

function getColorClass(value) {
  if(value.startsWith("v")) return "home";
  if(value.startsWith("a")) return "away";
  if(value === "BYE") return "bye";
  return "";
}

// Create cell
function createCell(team, week) {

  const td = document.createElement("td");

  const value = schedule[team][week];

  if (value) {
    const c = document.createElement("div");
    c.className = "p-1 cursor-pointer rounded";

    if(value === "BYE") {
      c.textContent = "BYE";
    } else {
      const opp = value.substring(1);
      const img = document.createElement("img");
      img.src = logos[opp];
      img.className = "inline w-5 h-5";
      c.appendChild(img);
      c.append(` ${value.startsWith("v")?"vs":"@"} ${opp}`);
    }

    c.onclick = () => {
      schedule[team][week] = "";
      render();
    };

    td.appendChild(c);
    return td;
  }

  // EDIT
  const btn = document.createElement("button");
  btn.textContent = "Pick";

  const menu = document.createElement("div");
  menu.className = "absolute bg-white border hidden";

  validOpponents[team].forEach(t=>{
    const item = document.createElement("div");
    item.textContent = t;

    item.onclick = ()=>{
      schedule[team][week] = "v"+t;
      schedule[t][week] = "a"+team;
      render();
    };

    menu.appendChild(item);
  });

  btn.onclick = ()=>menu.classList.toggle("hidden");

  td.appendChild(btn);
  td.appendChild(menu);
  return td;
}

// Render
function render(filter="") {
  tbody.innerHTML="";

  teams.forEach(team=>{
    const tr=document.createElement("tr");

    const tdTeam=document.createElement("td");
    tdTeam.textContent=team;
    tdTeam.className="sticky-col bg-gray-100 font-bold";
    tr.appendChild(tdTeam);

    weeks.forEach(w=>tr.appendChild(createCell(team,w)));

    tbody.appendChild(tr);
  });
}

render();

</script>
</body>
</html>
