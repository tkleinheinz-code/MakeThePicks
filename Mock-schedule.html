<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>2026 Mock Schedule Grid</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .sticky-col {
      position: sticky;
      left: 0;
      background: #f3f4f6;
      z-index: 20;
    }
  </style>
</head>

<body class="p-6 bg-gray-100">

<h1 class="text-3xl font-bold mb-4">2026 Mock Schedule Grid</h1>

<div class="overflow-auto border bg-white">
<table class="min-w-full text-sm text-center" id="grid">
  <thead class="bg-gray-300 sticky top-0 z-30">
    <tr>
      <th class="p-2 border sticky-col">Team</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
</div>

<script>

// ✅ Teams
const teams = [
  "BUF","MIA","NE","NYJ","BAL","CIN","CLE","PIT",
  "HOU","IND","JAX","TEN"
];

// ✅ Opponents (simplified working version)
const validOpponents = {
  BUF:["MIA","NE","NYJ","BAL"],
  MIA:["BUF","NE","NYJ"],
  NE:["BUF","MIA","NYJ"],
  NYJ:["BUF","MIA","NE"],
  BAL:["CIN","CLE","PIT","BUF"],
  CIN:["BAL","CLE","PIT"],
  CLE:["BAL","CIN","PIT"],
  PIT:["BAL","CIN","CLE"],
  HOU:["IND","JAX","TEN"],
  IND:["HOU","JAX","TEN"],
  JAX:["HOU","IND","TEN"],
  TEN:["HOU","IND","JAX"]
};

// ✅ Logos
const logos = {};
teams.forEach(t=>{
  logos[t] = `https://a.espncdn.com/i/teamlogos/nfl/500/${t==="WAS"?"wsh":t.toLowerCase()}.png`;
});

// ✅ Weeks
const weeks = ["W1","W2","W3","W4"];

// ✅ Build header
const headerRow = document.querySelector("#grid thead tr");
weeks.forEach(w=>{
  const th = document.createElement("th");
  th.textContent = w;
  th.className = "border p-1";
  headerRow.appendChild(th);
});

// ✅ Data store
let schedule = {};
teams.forEach(t=>{
  schedule[t] = {};
  weeks.forEach(w => schedule[t][w] = "");
});

const tbody = document.querySelector("#grid tbody");

// ✅ Create cell
function createCell(team, week){

  const td = document.createElement("td");
  const val = schedule[team][week];

  // ✅ DISPLAY MODE
  if(val){
    const d = document.createElement("div");

    const opp = val.substring(1);
    const isHome = val.startsWith("v");

    d.innerHTML = `<img src="${logos[opp]}" class="w-sName = "cursor-pointer";

    d.onclick = () => {
      schedule[team][week] = "";
      render();
    };

    td.appendChild(d);
    return td;
  }

  // ✅ EDIT MODE
  const btn = document.createElement("button");
  btn.textContent = "Pick";

  const menu = document.createElement("div");
  menu.className = "absolute bg-white border hidden";

  validOpponents[team].forEach(t=>{
    const item = document.createElement("div");

    item.innerHTML = `<img src="${logos[t]}" class="w-4 inline"p-1 hover:bg-gray-100 cursor-pointer";

    item.onclick = () => {
      schedule[team][week] = "v"+t;
      schedule[t][week] = "a"+team;
      render();
    };

    menu.appendChild(item);
  });

  btn.onclick = () => menu.classList.toggle("hidden");

  td.appendChild(btn);
  td.appendChild(menu);

  return td;
}

// ✅ Render
function render(){
  tbody.innerHTML = "";

  teams.forEach(team=>{
    const tr = document.createElement("tr");

    const td = document.createElement("td");
    td.textContent = team;
    td.className = "sticky-col font-bold";
    tr.appendChild(td);

    weeks.forEach(w=>{
      tr.appendChild(createCell(team,w));
    });

    tbody.appendChild(tr);
  });
}

// ✅ Run
render();

</script>

</body>
</html>
