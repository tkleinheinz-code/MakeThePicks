<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock Draft Room</title>
<link rel="stylesheet" href="styles.css">

<style>

/* Layout */
.container {
  max-width: 1100px;
  margin: 30px auto;
}

/* Header */
.room-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}

/* Left */
.room-info h1 {
  margin-bottom: 4px;
}

.room-info p {
  color: #ccc;
}

/* Invite */
.invite-box {
  margin-top: 10px;
}

.invite-box input {
  width: 240px;
  padding: 8px;
  background: #000;
  border: 1px solid #333;
  color: #fff;
}

/* Leaderboard */
.leaderboard {
  background: #111;
  border: 1px solid #333;
  padding: 15px;
  width: 260px;
}

.leaderboard h3 {
  color: #ffd77a;
  margin-bottom: 10px;
}

.leaderboard ul {
  padding: 0;
  list-style: none;
}

.leaderboard li {
  padding: 6px 0;
  border-bottom: 1px solid #333;
}

/* Draft list */
.drafts {
  background: #111;
  border: 1px solid #333;
  padding: 20px;
  margin-bottom: 20px;
}

.drafts h2 {
  color: #ffd77a;
  margin-bottom: 10px;
}

.draft-item {
  padding: 12px;
  border-bottom: 1px solid #333;
}

/* Submit box */
.submit-box {
  background: #111;
  border: 1px solid #333;
  padding: 20px;
}

textarea {
  width: 100%;
  height: 120px;
  padding: 10px;
  background: #000;
  border: 1px solid #333;
  color: #fff;
  margin-bottom: 10px;
}

  .pick-row {
  display: flex;
  gap: 10px;
  margin-bottom: 8px;
}

.pick-row span {
  width: 60px;
}

.pick-row select {
  flex: 1;
  padding: 6px;
  background: #000;
  border: 1px solid #333;
  color: #fff;
}

</style>
</head>

<body>

<header class="header">
  <div class="logo">
    <a href="index.html">MAKE THE PICKS</a>
  </div>
</header>

<main class="container">

  <!-- TOP HEADER -->
  <div class="room-header">

    <!-- LEFT SIDE -->
    <div class="room-info">
      <h1 id="roomName">Mock Room</h1>
      <p>Created by <span id="roomCreator">You</span></p>

      <div class="invite-box">
        <input id="roomCode" readonly>
        <button onclick="copyCode()">Copy Link</button>
      </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="leaderboard">
      <h3>Leaderboard</h3>
      <ul id="leaderboardList">
        <li>You — 0 pts</li>
      </ul>
    </div>

  </div>

  <!-- MOCK DRAFT LIST -->
  <div class="drafts">
    <h2>Mock Drafts</h2>
    <div id="draftList"></div>
  </div>

  <!-- SUBMIT -->
  <div class="submit-box">
  <h2>Submit Your Mock Draft</h2>

  <div id="draftBuilder"></div>

  <button class="cta-button" onclick="submitDraft()">Submit Draft</button>
</div>

</main>

<script>

/* Load room from localStorage */
const room = JSON.parse(localStorage.getItem('currentRoom'));

if (room) {
  document.getElementById('roomName').textContent = room.name;
  document.getElementById('roomCreator').textContent = room.creator || "You";
  document.getElementById('roomCode').value = room.code;

  loadDrafts(room);
  loadExperts(room);
}

/* Copy invite code */
function copyCode() {
  const codeInput = document.getElementById("roomCode");
  codeInput.select();
  document.execCommand("copy");
  alert("Room code copied!");
}

/* Load drafts */
function loadDrafts(room) {
  const container = document.getElementById('draftList');
  container.innerHTML = "";

  if (!room.drafts || room.drafts.length === 0) {
    container.innerHTML = "<div class='draft-item'>No drafts yet</div>";
    return;
  }

  room.drafts.forEach(d => {
    const div = document.createElement('div');
    div.className = "draft-item";
    div.textContent = d;
    container.appendChild(div);
  });
}

/* Load expert drafts */
function loadExperts(room) {
  if (!room.includeExperts || !room.experts) return;

  const container = document.getElementById('draftList');

  room.experts.forEach(e => {
    const div = document.createElement('div');
    div.className = "draft-item";
    div.textContent = e + " (Expert)";
    container.appendChild(div);
  });
}

/* Submit draft */
function submitDraft() {
  const rows = document.querySelectorAll('.pick-row');
  let draft = [];

  rows.forEach((row, index) => {
    const team = row.querySelector('.team-select').value;
    const player = row.querySelector('.player-select').value;

    if (team && player) {
      draft.push(`Pick ${index + 1}: ${team} — ${player}`);
    }
  });

  if (draft.length === 0) {
    alert("Fill out at least one pick");
    return;
  }

  const formatted = draft.join(" | ");

  room.drafts.push(formatted);

  localStorage.setItem('currentRoom', JSON.stringify(room));

  loadDrafts(room);
}

// Create draft rows
function buildDraftBoard() {
  const container = document.getElementById('draftBuilder');
container.innerHTML = "";  // ✅ prevents duplication if run again


  for (let i = 1; i <= 5; i++) {
    const row = document.createElement('div');
    row.className = "pick-row";

    row.innerHTML = `
      <span>Pick ${i}</span>

      <select class="team-select">
        <option value="">Team</option>
        ${teams.map(t => `<option>${t}</option>`).join("")}
      </select>

      <select class="player-select">
        <option value="">Player</option>
        ${players.map(p => `<option>${p}</option>`).join("")}
      </select>
    `;

    container.appendChild(row);
  }
}

    // ✅ Team list
const teams = [
  "Arizona Cardinals","Atlanta Falcons","Baltimore Ravens","Buffalo Bills",
  "Carolina Panthers","Chicago Bears","Cincinnati Bengals","Cleveland Browns",
  "Dallas Cowboys","Denver Broncos","Detroit Lions","Green Bay Packers",
  "Houston Texans","Indianapolis Colts","Jacksonville Jaguars","Kansas City Chiefs",
  "Las Vegas Raiders","Los Angeles Chargers","Los Angeles Rams","Miami Dolphins",
  "Minnesota Vikings","New England Patriots","New Orleans Saints","New York Giants",
  "New York Jets","Philadelphia Eagles","Pittsburgh Steelers","San Francisco 49ers",
  "Seattle Seahawks","Tampa Bay Buccaneers","Tennessee Titans","Washington Commanders"
];

// ✅ Player list (example — you can expand this later)
const players = [
  "Caleb Williams (QB)",
  "Drake Maye (QB)",
  "Jayden Daniels (QB)",
  "Marvin Harrison Jr. (WR)",
  "Malik Nabers (WR)",
  "Rome Odunze (WR)",
  "Joe Alt (OT)",
  "Olu Fashanu (OT)",
  "Dallas Turner (EDGE)",
  "Jared Verse (EDGE)"
];
  
// Run on load
buildDraftBoard();


</script>

</body>
</html>
